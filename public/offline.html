<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JDS Portal · No internet</title>
  <link rel="icon" href="/favicon.svg" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6f9; color: #1f2937; font: 15px/1.5 "Segoe UI", Inter, Arial, sans-serif }
    .box { text-align: center; padding: 32px 24px; max-width: 380px }
    .logo { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 14px; background: #1a4fa0; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 20px }
    h1 { font-size: 20px; margin: 0 0 6px }
    p { margin: 0 0 20px; color: #6b7280 }
    button { height: 40px; padding: 0 20px; border: 0; border-radius: 8px; background: #1a4fa0; color: #fff; font: 600 14px "Segoe UI", Inter, Arial, sans-serif; cursor: pointer }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">JDS</div>
    <h1>No internet connection</h1>
    <p>The JDS Portal shows live data, so it needs the internet. It will open as soon as you are back online.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
  <script>window.addEventListener('online', () => location.reload())</script>
</body>
</html>
