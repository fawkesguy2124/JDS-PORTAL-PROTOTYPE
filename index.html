<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/app/favicon-a-48.png" />
    <link rel="apple-touch-icon" href="/app/apple-touch-icon-a.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1a4fa0" />
    <meta name="application-name" content="JDS Portal" />
    <meta name="apple-mobile-web-app-title" content="JDS Portal" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JDS Logistics Portal</title>
    <style>
      /* shown until the app has loaded (the app window opens on this, not on a blank page) */
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #f3f5f8 }
      /* the same mark as the sidebar logo: navy squircle, JDS, amber bar (Control tower, 31 Oct 2026) */
      #boot .logo { position: relative; width: 64px; height: 64px; border-radius: 18px; background: #1a4fa0; color: #fff; display: grid; place-items: center; padding-bottom: 6px; box-sizing: border-box; font: 700 21px/1 Inter, "Segoe UI", Arial, sans-serif; letter-spacing: .02em; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); animation: boot 1.2s ease-in-out infinite }
      #boot .logo::after { content: ""; position: absolute; left: 50%; bottom: 14px; width: 26px; height: 4px; margin-left: -13px; border-radius: 2px; background: #f5a524 }
      @keyframes boot { 50% { opacity: .55 } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot"><div class="logo">JDS</div></div></div>
    <script>
      // Safety net (24 Oct 2026): if the portal hasn't started after 10 s (e.g. a broken
      // saved copy of its files), clear the app's saved files and reload once.
      (function () {
        var KEY = 'jds-boot-retry'
        setTimeout(function () {
          var tried = null
          try { tried = sessionStorage.getItem(KEY) } catch (e) {}
          if (!document.getElementById('boot')) { try { sessionStorage.removeItem(KEY) } catch (e) {} return }
          if (tried) return
          try { sessionStorage.setItem(KEY, '1') } catch (e) {}
          var work = []
          if (window.caches) work.push(caches.keys().then(function (k) { return Promise.all(k.map(function (x) { return caches.delete(x) })) }))
          if (navigator.serviceWorker) work.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.update().catch(function () {}) })) }))
          Promise.all(work).catch(function () {}).then(function () { location.reload() })
        }, 10000)
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
