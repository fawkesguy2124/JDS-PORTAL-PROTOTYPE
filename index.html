<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/app/favicon-48.png" />
    <link rel="apple-touch-icon" href="/app/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1a4fa0" />
    <meta name="application-name" content="JDS Portal" />
    <meta name="apple-mobile-web-app-title" content="JDS Portal" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JDS Logistics Portal</title>
    <style>
      /* shown until the app has loaded (the app window opens on this, not on a blank page) */
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #f4f6f9 }
      #boot .logo { width: 64px; height: 64px; border-radius: 14px; background: #1a4fa0; color: #fff; display: grid; place-items: center; font: 700 20px "Segoe UI", Inter, Arial, sans-serif; animation: boot 1.2s ease-in-out infinite }
      @keyframes boot { 50% { opacity: .55 } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot"><div class="logo">JDS</div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
