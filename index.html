<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/app/favicon-a-48.png" />
    <link rel="apple-touch-icon" href="/app/apple-touch-icon-a.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1a4fa0" />
    <meta name="application-name" content="JDS Portal" />
    <meta name="apple-mobile-web-app-title" content="JDS Portal" />
    <!-- viewport-fit=cover: the portal knows about the iPhone notch and home bar (1 Nov 2026) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>JDS Logistics Portal</title>
    <script>
      // iPhone zooms the page into any field with text under 16 px and stays zoomed. The
      // fields are 15 px on phones (one size everywhere), so iPhones get maximum-scale=1:
      // that stops only the automatic zoom, pinch-zoom still works there (1 Nov 2026).
      if (/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
        document.querySelector('meta[name=viewport]').setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover')
      }
    </script>
    <script>
      // The theme chosen in Settings (jds_prefs_v1, src/industrial/settings.js), set
      // before anything is drawn so a dark portal never flashes white (31 Oct 2026).
      (function () {
        var theme = 'light', p = null
        try { p = JSON.parse(localStorage.getItem('jds_prefs_v1') || 'null') } catch (e) {}
        // only the admin portal has a dark theme; login and the staff screen stay light
        var portal = location.pathname.indexOf('/admin') === 0
        if (!portal) p = p ? { density: p.density, text: p.text, motion: p.motion } : null
        if (p && p.theme === 'dark') theme = 'dark'
        else if (p && p.theme === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark'
        var root = document.documentElement
        root.setAttribute('data-theme', theme)
        root.style.colorScheme = theme
        if (p) {
          if (p.density) root.setAttribute('data-density', p.density)
          if (p.text) root.setAttribute('data-text', p.text)
          if (p.motion) root.setAttribute('data-motion', p.motion)
        }
        if (theme === 'dark') { var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', '#0e2650') }
      })()
    </script>
    <style>
      /* dark theme: the page and the boot screen start dark too */
      html[data-theme="dark"], html[data-theme="dark"] body { background: #0b1220 }
      html[data-theme="dark"] #boot { background: #0b1220 }
      html[data-motion="reduce"] #boot .logo { animation: none }
      /* shown until the app has loaded (the app window opens on this, not on a blank page) */
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #f3f5f8 }
      /* the same mark as the sidebar logo: navy squircle, JDS, amber bar (Control tower, 31 Oct 2026) */
      #boot .logo { position: relative; width: 64px; height: 64px; border-radius: 18px; background: #1a4fa0; color: #fff; display: grid; place-items: center; padding-bottom: 6px; box-sizing: border-box; font: 700 21px/1 Inter, "Segoe UI", Arial, sans-serif; letter-spacing: .02em; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); animation: boot 1.2s ease-in-out infinite }
      #boot .logo::after { content: ""; position: absolute; left: 50%; bottom: 14px; width: 26px; height: 4px; margin-left: -13px; border-radius: 2px; background: #f5a524 }
      @keyframes boot { 50% { opacity: .55 } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot"><div class="logo">JDS</div></div></div>
    <script>
      // Safety net (24 Oct 2026): if the portal hasn't started after 10 s (e.g. a broken
      // saved copy of its files), clear the app's saved files and reload once.
      (function () {
        var KEY = 'jds-boot-retry'
        setTimeout(function () {
          var tried = null
          try { tried = sessionStorage.getItem(KEY) } catch (e) {}
          if (!document.getElementById('boot')) { try { sessionStorage.removeItem(KEY) } catch (e) {} return }
          if (tried) return
          try { sessionStorage.setItem(KEY, '1') } catch (e) {}
          var work = []
          if (window.caches) work.push(caches.keys().then(function (k) { return Promise.all(k.map(function (x) { return caches.delete(x) })) }))
          if (navigator.serviceWorker) work.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.update().catch(function () {}) })) }))
          Promise.all(work).catch(function () {}).then(function () { location.reload() })
        }, 10000)
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
